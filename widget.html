<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'self'">
<title>NowPlaying</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 12px;
    background: rgba(18, 18, 26, var(--tint, 0.45)); color: #fff; user-select: none;
    font-family: "Segoe UI Variable", "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif;
    -webkit-app-region: drag;
  }
  #cover {
    position: relative; flex: none; width: 72px; height: 72px; border-radius: 10px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(150deg, #1b1e33 0%, #0c0e19 100%);
  }
  #cover::before {
    content: ""; position: absolute; inset: -20%;
    background: radial-gradient(circle at 50% 55%, rgba(120, 130, 255, 0.34), rgba(120, 130, 255, 0) 62%);
  }
  #cover img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; }
  #cover img[hidden] { display: none; }
  #cover.has-img::before, #cover.has-img #ph { display: none; }
  #ph {
    position: relative; width: 34px; height: 34px; fill: none; stroke: #b6bdff; stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(130, 140, 255, 0.6));
  }
  @media (prefers-reduced-motion: no-preference) {
    #cover::before { animation: glow 6s ease-in-out infinite; }
    #ph { animation: breathe 6s ease-in-out infinite; }
  }
  @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes breathe { 0%, 100% { opacity: 0.6; transform: translateY(1px); } 50% { opacity: 1; transform: translateY(-1px); } }
  #info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55); }
  #top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: rgba(255, 255, 255, 0.68); }
  #source { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #state svg { width: 12px; height: 12px; fill: rgba(255, 255, 255, 0.85); display: block; }
  .line { overflow: hidden; white-space: nowrap; }
  .line > span { display: inline-block; white-space: nowrap; will-change: transform; }
  .line > span > span { display: inline-block; }
  #title { font-size: 15px; font-weight: 600; line-height: 1.35; }
  #artist { font-size: 12px; color: rgba(255, 255, 255, 0.78); line-height: 1.35; }
  #bar { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.24); margin-top: 7px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #fff; }
  #bar.none { visibility: hidden; }
</style>
</head>
<body>
  <div id="cover">
    <svg id="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
    <img id="img" alt="" hidden>
  </div>
  <div id="info">
    <div id="top">
      <span id="source"></span>
      <span id="state"></span>
    </div>
    <div class="line" id="title"><span></span></div>
    <div class="line" id="artist"><span></span></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <script src="widget.js"></script>
</body>
</html>

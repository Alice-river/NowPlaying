name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: NowPlaying
          path: dist/NowPlaying.exe

  # v1.0.0 のようなタグを push すると、exe を Releases に載せる
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NowPlaying

      - uses: softprops/action-gh-release@v2
        with:
          files: NowPlaying.exe
          generate_release_notes: true
